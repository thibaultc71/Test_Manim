<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Mon Plan de Course</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7a00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan Course">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-icon">🏃</span>
    <div>
      <h1 id="race-name">Mon Plan de Course</h1>
      <p id="race-countdown" class="countdown">—</p>
    </div>
  </div>
  <button id="settings-btn" class="icon-btn" aria-label="Réglages">⚙️</button>
</header>

<main>
  <section class="calendar-nav">
    <button id="prev-month" class="icon-btn" aria-label="Mois précédent">‹</button>
    <h2 id="month-label">—</h2>
    <button id="next-month" class="icon-btn" aria-label="Mois suivant">›</button>
  </section>

  <section class="weekday-row">
    <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
  </section>

  <section id="calendar-grid" class="calendar-grid"></section>

  <section class="legend">
    <span class="legend-item"><i class="dot dot-endurance"></i>Endurance</span>
    <span class="legend-item"><i class="dot dot-fractionne"></i>Fractionné</span>
    <span class="legend-item"><i class="dot dot-repos"></i>Repos</span>
    <span class="legend-item"><i class="dot dot-course"></i>Course</span>
    <span class="legend-item"><i class="dot dot-autre"></i>Autre</span>
  </section>

  <section class="today-card" id="today-card" hidden>
    <h3>Prochaine séance</h3>
    <div id="today-card-body"></div>
  </section>
</main>

<button id="fab-add" class="fab" aria-label="Ajouter une séance">+</button>

<!-- Day detail / edit sheet -->
<div id="sheet-overlay" class="overlay" hidden>
  <div class="sheet" id="session-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 id="sheet-date-label">Séance</h2>
      <button id="sheet-close" class="icon-btn" aria-label="Fermer">✕</button>
    </div>

    <div id="sheet-view-mode">
      <div id="sheet-view-content" class="session-detail"></div>
      <div class="sheet-actions">
        <button id="sheet-edit-btn" class="btn btn-secondary">Modifier</button>
        <button id="sheet-delete-btn" class="btn btn-danger">Supprimer</button>
      </div>
    </div>

    <form id="sheet-form" class="sheet-form" hidden>
      <label class="field">
        <span>Type de séance</span>
        <select id="field-type">
          <option value="endurance">Endurance</option>
          <option value="fractionne">Fractionné</option>
          <option value="repos">Repos</option>
          <option value="course">Course (objectif)</option>
          <option value="autre">Autre</option>
        </select>
      </label>

      <div class="field-row">
        <label class="field">
          <span>Distance (km)</span>
          <input type="number" id="field-distance" step="0.1" min="0" placeholder="10">
        </label>
        <label class="field">
          <span>Temps (min)</span>
          <input type="number" id="field-duration" step="1" min="0" placeholder="50">
        </label>
      </div>

      <label class="field">
        <span>Allure cible (min:sec / km)</span>
        <input type="text" id="field-pace" placeholder="ex: 5:00" pattern="[0-9]{1,2}:[0-9]{2}">
      </label>

      <label class="field">
        <span>Exercices / détails (fractionné, récup, etc.)</span>
        <textarea id="field-description" rows="4" placeholder="ex: 10x400m rapide / 200m récup trot"></textarea>
      </label>

      <label class="field checkbox-field">
        <input type="checkbox" id="field-completed">
        <span>Séance effectuée</span>
      </label>

      <div class="sheet-actions">
        <button type="button" id="form-cancel-btn" class="btn btn-secondary">Annuler</button>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<!-- Settings sheet -->
<div id="settings-overlay" class="overlay" hidden>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2>Réglages</h2>
      <button id="settings-close" class="icon-btn" aria-label="Fermer">✕</button>
    </div>
    <form id="settings-form" class="sheet-form">
      <label class="field">
        <span>Nom de la course</span>
        <input type="text" id="settings-race-name" placeholder="ex: Marathon de Paris">
      </label>
      <label class="field">
        <span>Date de la course</span>
        <input type="date" id="settings-race-date">
      </label>

      <hr class="divider">

      <div class="field">
        <span>Sauvegarde</span>
        <div class="button-row">
          <button type="button" id="export-btn" class="btn btn-secondary">Exporter (JSON)</button>
          <label class="btn btn-secondary file-btn">
            Importer
            <input type="file" id="import-input" accept="application/json" hidden>
          </label>
        </div>
      </div>

      <div class="sheet-actions">
        <button type="button" id="settings-cancel-btn" class="btn btn-secondary">Fermer</button>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
